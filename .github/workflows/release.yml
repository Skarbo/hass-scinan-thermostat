name: Release

# Push a tag like v2.0.0 (or v2.0.0b1 for a pre-release) to create the GitHub
# release. The Marketplace and HACS install from these releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version custom_components/scinan_thermostat/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the manifest version $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if echo "$GITHUB_REF_NAME" | grep -qE '(a|b|rc)[0-9]+$'; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease
